# hop config, imported from ~/.config/hop/config.zsh by `hop import`.
# Every kind is written out in full, so no recipe change can move these rows.
version = 1
recipes = []

[settings]
env_colors = { prod = ['prod'], staging = ['staging'], dev = ['dev', 'playground'] }

[[kind]]
name = 'tg'
desc = 'terragrunt units'
default = true
marker = 'terragrunt.hcl'
under = 'terraform'
layout = ['scope,env,region,name...', 'scope,name...']
trim = { scope = 'acct-', env = 'env-' }
preview = ['main.tf', '*.tf', 'terragrunt.hcl', 'README.md']
preview_skip = ['provider_*.tf', 'variables_defaults.tf', 'versions_override.tf']

[[kind]]
name = 'mod'
desc = 'terraform modules'
default = true
dirs = ['terraform/modules']
depth = 2
preview = ['main.tf', '*.tf', 'terragrunt.hcl', 'README.md']
preview_skip = ['provider_*.tf', 'variables_defaults.tf', 'versions_override.tf']

[[kind]]
name = 'helm'
desc = 'helm charts, values and apps'
default = true

  [[kind.source]]
  dirs = ['kubernetes/values', 'services', 'charts']
  preview = ['docs/playbooks.md', 'Chart.yaml', 'values.yaml', 'charts/*/Chart.yaml', '*.y*ml', 'README.md']

  [[kind.source]]
  marker = 'Chart.yaml'
  under = 'kubernetes/charts'
  layout = ['name...']
  scope = 'kubernetes/charts'
  preview = ['Chart.yaml']

  [[kind.source]]
  files = ['kubernetes/services/**/*.yaml']
  under = 'kubernetes/services'
  layout = ['name...']
  strip_ext = true
  exclude = ['*/tests/*']
  scope = 'kubernetes/services'

  [[kind.source]]
  files = ['cluster-apps/charts/cluster-apps/templates/*.yaml']
  under = 'cluster-apps/charts/cluster-apps/templates'
  strip_ext = true
  scope = 'cluster-apps'

[[kind]]
name = 'serverless'
desc = 'lambda deployables'
dirs = ['serverless']
preview = ['serverless.yml', 'serverless.yaml', 'template.yaml', 'requirements.txt', 'README.md']

[[kind]]
name = 'puppet'
desc = 'puppet modules'
dirs = ['modules']
preview = ['README.md', 'README', 'CLAUDE.md']

[[kind]]
name = 'backstage'
desc = 'catalog entities'
files = ['backstage/*.yaml']
name_from = 'yaml:metadata.name'
scope = 'backstage'

[[kind]]
name = 'dir'
desc = 'repo root and top-level dirs'
default = true
builtin = 'dir'

[[kind]]
name = 'file'
desc = 'every tracked file'
files = ['**']

[[kind]]
name = 'mesos'
desc = 'mesos services'
default = true
dirs = ['mesos/services']
scope = '-'
preview = ['service.conf', 'conf/base.conf', 'conf/service-base.conf', 'playbook/*.md', 'dashboards/*']

[[kind]]
name = 'conf'
desc = 'per-role conf files'
files = ['mesos/services/*/conf/*/*.conf']
under = 'mesos/services'
layout = ['scope,-,name,env']
strip_ext = true

[[kind]]
name = 'rules'
desc = 'prometheus rules'
files = ['kubernetes/charts/service-rules/*/*/rules.yaml']
under = 'kubernetes/charts/service-rules'
layout = ['scope,env,-']
name_template = '{scope}/{env}'
