# hop config, imported from @TESTDATA@/fixture.zsh by `hop import`.
# Every kind is written out in full, so no recipe change can move these rows.
version = 1
recipes = []

[settings]
env_colors = { prod = ['prod'], staging = ['staging'], dev = ['dev', 'playground'] }

[[kind]]
name = 'dir'
desc = 'repo root and top-level dirs'
default = true
builtin = 'dir'

[[kind]]
name = 'file'
desc = 'every tracked file'
files = ['**']

[[kind]]
name = 'helm'
desc = 'helm charts, values and apps'
default = true

  [[kind.source]]
  dirs = ['kubernetes/values', 'services', 'charts']
  preview = ['docs/playbooks.md', 'Chart.yaml', 'values.yaml', 'charts/*/Chart.yaml', '*.y*ml', 'README.md']

  [[kind.source]]
  marker = 'Chart.yaml'
  under = 'kubernetes/charts'
  layout = ['name...']
  scope = 'kubernetes/charts'
  preview = ['Chart.yaml']

  [[kind.source]]
  files = ['kubernetes/services/**/*.yaml']
  under = 'kubernetes/services'
  layout = ['name...']
  strip_ext = true
  exclude = ['*/tests/*']
  scope = 'kubernetes/services'

  [[kind.source]]
  files = ['cluster-apps/charts/cluster-apps/templates/*.yaml']
  under = 'cluster-apps/charts/cluster-apps/templates'
  strip_ext = true
  scope = 'cluster-apps'

[[kind]]
name = 'backstage'
desc = 'catalog entities'
files = ['backstage/*.yaml']
name_from = 'yaml:metadata.name'
scope = 'backstage'

[[kind]]
name = 'tg'
desc = 'units'
default = true
marker = 'terragrunt.hcl'
under = 'infra'
layout = ['scope,env,region,name...', 'scope,name...']
trim = { scope = ['acct-', 'a'], env = 'env-' }
preview = ['main.tf', '*.tf', 'terragrunt.hcl']
preview_skip = ['provider_*.tf']

[[kind]]
name = 'tgx'
desc = 'excl'
marker = 'terragrunt.hcl'
layout = ['scope,name...']
name_template = '{scope}:{env}:{name}'
exclude = ['*/shared/*', 'infra/acct-b*']

[[kind]]
name = 'tgroot'
desc = 'no layout, no under'
marker = 'terragrunt.hcl'

[[kind]]
name = 'tie'
desc = 'equal width'
marker = 'terragrunt.hcl'
under = 'infra'
layout = ['scope,env', 'scope,name...']

[[kind]]
name = 'svc'
desc = 'dirs'
dirs = ['svc', 'nope']
preview = ['README.md', '**/*.md', 'f']

[[kind]]
name = 'svc2'
desc = 'depth2'
dirs = ['svc']
depth = 2
scope = 'LIT'

[[kind]]
name = 'cfg'
desc = 'files'
files = ['cfg/*/conf/*/*']
under = 'cfg'
layout = ['scope,-,name,env']
strip_ext = true

[[kind]]
name = 'cfgnl'
desc = 'files, no layout'
files = ['cfg/**']
trim = { name = 'p' }
name_template = '{scope}!'
strip_ext = true

[[kind]]
name = 'ents'
desc = 'entities'
files = ['ents/*']
name_from = 'yaml:metadata.name'
scope = 'E'

[[kind]]
name = 'odd'
desc = 'odd names'
files = ['odd/**', '[.]rootdot']
exclude = ['odd/skip*']

# Not imported: fixture-fn.zsh's --fn provider, which hop runs as fx.sh.

[[kind]]
name = 'fx'
desc = 'a user provider'
exec = ['sh', '@TESTDATA@/fx.sh']
