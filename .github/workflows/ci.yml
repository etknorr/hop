name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The runner image ships Microsoft apt repos this project never uses.
          # - A 403 from one of them fails apt-get update outright, measured at 1 run in 30.
          # - Only the removal may fail, because finding nothing to remove is a success.
          # - update and install stay unguarded, so a zsh that cannot be installed still fails.
          grep -rl packages.microsoft.com /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y zsh

      # Debian's packaged fzf (0.44.1) predates --accept-nth, so pull the real upstream release.
      - name: Install fzf (Ubuntu)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo junegunn/fzf --pattern 'fzf-*-linux_amd64.tar.gz' --output fzf.tar.gz --clobber
          tar -xzf fzf.tar.gz fzf
          sudo install -m 0755 fzf /usr/local/bin/fzf
          rm -f fzf fzf.tar.gz

      - name: Install fzf (macOS)
        if: runner.os == 'macOS'
        run: brew install fzf

      - name: Print tool versions
        run: |
          zsh --version
          fzf --version
          git --version

      - name: Assert zsh is 5.9+
        run: |
          zsh -c '
            emulate -L zsh
            if [[ ${ZSH_VERSION%%.*} -lt 5 || ( ${ZSH_VERSION%%.*} -eq 5 && ${${ZSH_VERSION#5.}%%.*} -lt 9 ) ]]; then
              print -ru2 -- "expected zsh 5.9+, got ${ZSH_VERSION}"
              exit 1
            fi
          '

      # Must stay strictly inside timeout-minutes above, or one hung suite eats the whole job budget and the per-suite bound never fires.
      - name: Run test suite
        env:
          HOP_T_TIMEOUT: '180'
        run: zsh tests/run

  # The test job above gets the LATEST fzf, and fzf's behaviour moves under hop between releases.
  # - --filter honours --accept-nth on 0.73.1 but ignores it on 0.60.3 and 0.67.0, which broke headless hop on the floor unseen.
  # - 0.60.3 is HOP_FZF_MIN, and 0.67.0 is the first release that accepts --freeze-left.
  floor:
    name: floor (fzf ${{ matrix.fzf }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        fzf: ['0.60.3', '0.67.0']
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          set -euo pipefail
          # Same removal as the test job above, for the same 403.
          grep -rl packages.microsoft.com /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install fzf ${{ matrix.fzf }}
        env:
          GH_TOKEN: ${{ github.token }}
          FZF_VER: ${{ matrix.fzf }}
        run: |
          set -euo pipefail
          dl=$(mktemp -d)
          tarball="fzf-${FZF_VER}-linux_amd64.tar.gz"
          gh release download "v${FZF_VER}" --repo junegunn/fzf --dir "$dl" \
            --pattern "$tarball" --pattern "fzf_${FZF_VER}_checksums.txt"
          # grep fails the step when no line names the tarball, so a renamed asset cannot skip the check.
          line=$(grep -E "^[0-9a-f]{64}  ${tarball}\$" "$dl/fzf_${FZF_VER}_checksums.txt")
          (cd "$dl" && printf '%s\n' "$line" | sha256sum --check --strict -)
          tar -xzf "$dl/$tarball" -C "$dl" fzf
          sudo install -m 0755 "$dl/fzf" /usr/local/bin/fzf
          rm -rf -- "$dl"

      # A different fzf earlier on PATH would quietly turn this leg into a second copy of the test job.
      - name: Assert fzf is ${{ matrix.fzf }}
        env:
          FZF_VER: ${{ matrix.fzf }}
        run: |
          set -euo pipefail
          got=$(fzf --version)
          printf '%s\n' "$got"
          case "$got" in
            "${FZF_VER} "*) ;;
            *) echo "expected fzf ${FZF_VER}, got: ${got}" >&2; exit 1 ;;
          esac

      # tests/run takes ONE pattern, so the suites are one glob alternation.
      - name: Run the fzf-sensitive suites
        env:
          HOP_T_TIMEOUT: '180'
        run: zsh tests/run 'suite_(nottty|match|actions|integration|keymap|pty_escape|pty|pty_filter|layout).zsh'

  lint:
    name: lint (zsh -n)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: |
          set -euo pipefail
          # Same removal as the test job above, for the same 403 that never reached zsh -n at all.
          grep -rl packages.microsoft.com /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f || true
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Syntax check every zsh script
        run: |
          set -euo pipefail
          status=0
          # *.zsh files anywhere in the repo.
          while IFS= read -r -d '' f; do
            zsh -n "$f" || status=1
          done < <(find . -name '*.zsh' -not -path './.git/*' -print0)
          # bin/* scripts.
          for f in bin/*; do
            zsh -n "$f" || status=1
          done
          # the test runner itself.
          zsh -n tests/run || status=1
          exit $status
