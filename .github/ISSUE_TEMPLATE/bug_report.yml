name: Bug report
description: Something in hop is broken or behaving unexpectedly.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. `hop` is a zsh function running in your own
        shell, so the state of that shell is most of the evidence — see the doctor section below.

  - type: textarea
    id: doctor
    attributes:
      label: hop --doctor=short output
      description: >
        Run `hop --doctor=short` and paste the full output here. It's almost always the fastest
        way to find the cause: HOP_HOME, every HOP_* setting, the version of each optional tool,
        and counts in place of names.

        `--doctor=short` withholds your current directory, your workspace and kind names, and
        any config path you've customised off the shipped default, replacing each with a count —
        which is what makes it safe to paste into a public issue. Plain `hop --doctor` prints all
        of those in full — it's for reading locally, never for pasting here.
      placeholder: |
        HOP_DEBUG=1 hop            # reproduce the problem first, if you can
        hop --doctor=short         # then paste everything below
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact keys pressed and commands run, in order. Note if it needs a specific kind, config, or repo shape to reproduce.
      placeholder: |
        1. cd into a repo with ...
        2. hop
        3. press ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: hop version
      description: From the `version` line of `hop --doctor=short`, or `git -C ~/.local/share/hop describe --tags --always`.
    validations:
      required: false
