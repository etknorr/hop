# The repo root plus every top-level tracked dir, which is what gets you back out of a deep one.
[[kind]]
name = "dir"
desc = "repo root and top-level dirs"
default = true
builtin = "dir"
# .[!g]* drops hidden dirs such as .cargo and .vscode but keeps the git host's .github and .gitlab.
skip = ["target", "tmp", ".[!g]*"]
